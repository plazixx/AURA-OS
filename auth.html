<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA-OS — Вход</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/seasonal-design.css"><style>.auth-wrap{max-width:560px;margin:7vh auto;padding:24px}.auth-card{background:#141416;border:1px solid #38383e;border-radius:16px;padding:28px}.auth-card label{display:block;margin:16px 0 7px}.auth-card input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #49474f;background:#202024;color:#fff}.auth-card button,.auth-link{margin-top:14px;padding:12px 16px;border-radius:9px;border:1px solid #ff794f;background:#ff794f;color:#17100e;font-weight:700;cursor:pointer}.auth-card button:disabled{opacity:.6}.auth-link{display:inline-block;text-decoration:none;background:transparent;color:#fff;border-color:#49474f}.message{min-height:24px;color:#a8e6b0}.message[data-error=true]{color:#ff9b7d}.muted{color:#aaa}</style></head><body data-aura-page="auth"><main class="auth-wrap"><div class="logo">AURA<span>.</span></div><section class="auth-card"><p class="eyebrow">ЛИЧНЫЙ АККАУНТ</p><h1>Вход в AURA-OS</h1><p class="muted">Создай аккаунт или войди, используя почту и пароль.</p><p id="account-state" class="muted">Проверяем состояние аккаунта…</p><form id="auth-form"><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="email" required><label for="password">Пароль (не менее 6 символов)</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button id="submit" type="submit">Войти</button></form><button id="mode-toggle" class="auth-link" type="button">Впервые здесь? Создать аккаунт</button><button id="sign-out" class="auth-link" type="button" hidden>Выйти</button><p id="message" class="message" aria-live="polite">Войди, чтобы продолжить.</p><p class="muted">Пока подключена только авторизация. Синхронизация разделов с облаком — следующий шаг.</p><a class="auth-link" href="index.html">← Вернуться в AURA-OS</a></section></main><script type="module" src="js/firebase-auth.js"></script><script src="js/seasonal-theme.js"></script></body></html>
